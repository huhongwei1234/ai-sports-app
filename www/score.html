<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>成绩分析 - AI体育</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .card-header {
            padding: 10px 14px;
            border-bottom: 1px solid #edf2f7;
            background: #f8fafc;
        }

        .card-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e3c72;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-badge.connected { background: #d4edda; color: #155724; }
        .status-badge.disconnected { background: #f8d7da; color: #721c24; }
        .status-badge.connecting { background: #fff3cd; color: #856404; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .stat-card.blue { background: linear-gradient(135deg, #1e3c72, #2a5298); }
        .stat-card.green { background: linear-gradient(135deg, #4CAF50, #8BC34A); }
        .stat-card.orange { background: linear-gradient(135deg, #ff9800, #ffc107); }
        .stat-card.red { background: linear-gradient(135deg, #f44336, #e91e63); }

        .stat-title {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        .search-box {
            padding: 10px;
            background: #f9fbfe;
            border-bottom: 1px solid #eef2f8;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .search-input-group input, .search-input-group select {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #cfdfed;
            border-radius: 28px;
            font-size: 0.85rem;
            background: white;
        }

        .search-input-group button {
            background: #2c6e9e;
            border: none;
            padding: 0 24px;
            border-radius: 32px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .search-input-group button:hover {
            background: #1f557c;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 12px;
            background: #e0e0e0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-sm:hover {
            background: #c0c0c0;
        }

        .real-time-log {
            background: #1e1e2e;
            color: #00ff88;
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            max-height: 150px;
            overflow: auto;
        }

        .real-time-log .log-item {
            padding: 4px 0;
            border-bottom: 1px solid #333;
            font-size: 11px;
        }

        /* 实时成绩表格 */
        .realtime-table-container {
            overflow-x: auto;
            padding: 0 12px 10px 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .realtime-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .realtime-table th,
        .realtime-table td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
        }

        .realtime-table th {
            background: #f8f9fa;
            color: #666;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .realtime-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .score-table-container {
            overflow-x: auto;
            padding: 0 12px 10px 12px;
        }

        .score-table {
            width: 100%;
            border-collapse: collapse;
        }

        .score-table th,
        .score-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
            font-size: 13px;
        }

        .score-table th {
            background: #f8f9fa;
            color: #666;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-excellent { background: #d4edda; color: #2e7d32; }
        .badge-good { background: #d1ecf1; color: #0c5460; }
        .badge-pass { background: #fff3cd; color: #856404; }
        .badge-fail { background: #f8d7da; color: #721c24; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8c9ab0;
            font-size: 0.8rem;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #2c6e9e;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            border-top: 1px solid #edf2f7;
        }

        .page-btn {
            padding: 5px 12px;
            border: 1px solid #cfdfed;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 12px;
        }

        .page-btn.active {
            background: #2c6e9e;
            color: white;
            border-color: #2c6e9e;
        }

        @media (max-width: 780px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .search-input-group { flex-direction: column; }
            .search-input-group button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🏃 AI体育<span>成绩分析</span></div>
        <div class="nav-links">
            <button class="nav-btn" onclick="location.href='index.html'">数据看板</button>
            <button class="nav-btn" onclick="location.href='student.html'">学生管理</button>
            <button class="nav-btn active" onclick="location.href='score.html'">成绩分析</button>
            <button class="nav-btn" onclick="location.href='video.html'">视频回放</button>
            <button class="nav-btn" onclick="location.href='camera.html'">底库管理</button>
        </div>
        <div class="user-info">
            <span class="school-name-display" id="schoolNameDisplay"></span>
            <img class="logo-img" src="../../logo.jpg" alt="logo" onerror="this.style.display='none'">
        </div>
    </div>

    <div class="back-home">
        <a href="index.html" class="back-home-btn">🏠 返回首页</a>
    </div>

    <div class="container">
        <!-- WebSocket 实时数据卡片 -->
        <div class="card">
            <div class="card-header" style="display:flex; align-items:center; flex-wrap:nowrap; gap:8px;">
                <h3 style="white-space:nowrap; flex-shrink:0;">🔌 实时数据监控</h3>
                <span id="wsStatus" class="status-badge connecting" style="flex-shrink:0;">⏳ 连接中...</span>
                <div class="btn-group" style="margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; align-items:center;">
                    <button class="btn-sm" id="connectBtn" style="font-size:14px; padding:6px 14px;">🔗 连接</button>
                    <button class="btn-sm" id="disconnectBtn" style="font-size:14px; padding:6px 14px;">🔌 断开</button>
                    <button class="btn-sm" id="clearLogBtn" style="font-size:14px; padding:6px 14px;">🗑️ 清空日志</button>
                    <button class="btn-sm" id="clearDataBtn" style="font-size:14px; padding:6px 14px;">📊 清空数据</button>
                </div>
            </div>
            <div id="wsLog" class="real-time-log" style="margin-top:4px;">
                <div class="log-item">📡 等待连接...</div>
            </div>
        </div>

        <!-- 实时成绩数据卡片 -->
        <div class="card">
            <div class="card-header">
                <h3>⚡ 实时成绩数据</h3>
                <span id="realtimeCount">0条</span>
            </div>
            <div class="realtime-table-container">
                <table class="realtime-table" id="realtimeTable">
                    <thead>
                        <tr><th>时间</th><th>学号</th><th>姓名</th><th>运动项目</th><th>成绩</th><th>评级</th></tr>
                    </thead>
                    <tbody id="realtimeTableBody">
                        <tr><td colspan="6" style="text-align:center; padding:20px;">暂无实时数据，等待WebSocket推送...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 查询表单 -->
        <div class="card">
            <div class="card-header">
                <h3>🔍 成绩查询</h3>
            </div>
            <div class="search-box" style="border-bottom: none;">
                <div class="search-input-group">
                    <input type="text" id="searchUid" placeholder="学号/UID" value="">
                    <input type="text" id="searchName" placeholder="姓名" value="">
                    <select id="searchSport">
                        <option value="" selected>全部项目</option>
                        <optgroup label="🏃 跑步类">
                            <option value="E-2-1">50米短跑</option>
                            <option value="E-2-2">100米短跑</option>
                            <option value="E-2-3">800米长跑</option>
                            <option value="E-2-4">1000米长跑</option>
                            <option value="E-2-8">自由跑</option>
                            <option value="E-2-9">方阵跑</option>
                            <option value="E-2-16">50×8折返跑</option>
                        </optgroup>
                        <optgroup label="💪 素质类">
                            <option value="E-1-1">仰卧起坐</option>
                            <option value="E-1-2">引体向上</option>
                            <option value="E-1-3">立定跳远</option>
                            <option value="E-1-4">单人跳绳</option>
                            <option value="E-1-5">坐位体前屈</option>
                            <option value="E-1-6">实心球</option>
                            <option value="E-1-7">立定摸高</option>
                            <option value="E-1-9">斜身引体</option>
                            <option value="E-1-10">多人跳绳</option>
                        </optgroup>
                        <optgroup label="⚽ 球类">
                            <option value="E-3-1">足球颠球</option>
                            <option value="E-3-2">足球绕杆</option>
                            <option value="E-3-5">篮球绕杆</option>
                        </optgroup>
                    </select>
                    <button id="searchBtn">🔍 查询</button>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card blue">
                <div class="stat-title">总成绩数</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card green">
                <div class="stat-title">总有效个数</div>
                <div class="stat-value" id="totalLegal">0</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-title">平均成绩</div>
                <div class="stat-value" id="avgScore">0</div>
            </div>
            <div class="stat-card red">
                <div class="stat-title">最佳成绩</div>
                <div class="stat-value" id="bestScore">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">参与人数</div>
                <div class="stat-value" id="studentCount">0</div>
            </div>
        </div>

        <!-- 成绩记录表格 -->
        <div class="card">
            <div class="card-header">
                <h3>📋 成绩记录</h3>
                <span id="resultCount">0条</span>
            </div>
            <div class="score-table-container">
                <table class="score-table" id="scoreTable">
                    <thead>
                        <tr><th>时间</th><th>学号</th><th>姓名</th><th>班级</th><th>运动项目</th><th>成绩</th><th>有效个数</th><th>违规次数</th><th>评级</th></tr>
                    </thead>
                    <tbody id="scoreTableBody">
                        <tr><td colspan="9" style="text-align:center;">暂无数据，请点击查询</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        // ========== WebSocket 配置 ==========
        const WS_URL = "ws://192.168.2.240:8080/ws/training_task_score/data_sync_inner_special_channel";
        
        // ========== API配置 ==========
        const API_BASE = "http://192.168.2.240:8080";
        const QUERY_BY_UID_API = API_BASE + "/api/v1/data/score/qybyuid";

        // ========== 运动项目映射 ==========
        const SPORT_NAME_MAP = {
            // 计时跑
            'E-2-1': '50米短跑', 'E-2-2': '100米短跑', 'E-2-3': '800米长跑',
            'E-2-4': '1000米长跑', 'E-2-5': '200米短跑', 'E-2-6': '400米短跑',
            'E-2-7': '1500米长跑', 'E-2-8': '自由跑', 'E-2-9': '方阵跑',
            'E-2-11': '自由跑+方阵跑', 'E-2-12': '60米短跑', 'E-2-13': '80米栏',
            'E-2-14': '110米栏', 'E-2-15': '100米栏', 'E-2-16': '50×8折返跑',
            // 素质
            'E-1-1': '仰卧起坐', 'E-1-2': '引体向上', 'E-1-3': '立定跳远',
            'E-1-4': '单人跳绳', 'E-1-5': '坐位体前屈', 'E-1-6': '实心球',
            'E-1-7': '立定摸高', 'E-1-9': '斜身引体', 'E-1-10': '多人跳绳',
            // 球类
            'E-3-1': '足球颠球', 'E-3-2': '足球绕杆', 'E-3-5': '篮球绕杆',
            'E-3-6': '篮球投篮', 'E-3-7': '篮球运投', 'E-1-6-1': '实心球(球类)',
            'E-3-9': '排球垫球(对墙)', 'E-3-10': '排球垫球(对空)',
            // 测量类
            'E-5-1': '身高体重BMI', 'E-5-2': '肺活量',
            // 特训版
            'S-1-11': '仰卧起坐/俯卧撑', 'S-1-2': '引体向上/单杠卷身上',
            'S-1-4': '双杠臂屈伸', 'S-1-5': '双杠支撑移动', 'S-1-6': '俯卧撑',
            'S-2-7': '5x10折返跑', 'S-1-10': '单人跳绳/深蹲',
            'S-2-2': '3000米长跑', 'S-2-5': '5000米长跑',
            // 综合版 / 飞扬体育
            'C-3-1': '羽毛球鹰眼', 'C-3-2': '篮球运投',
            'E-1-10-15': '三合一多人跳绳', 'E-1-1-15': '三合一仰卧起坐',
            'E-1-3-17': '三合一立定跳远'
        };

        function getSportName(sportId) {
            return SPORT_NAME_MAP[sportId] || sportId || '未知项目';
        }

        function formatTimeFromMs(durationMs) {
            if (!durationMs && durationMs !== 0) return '-';
            const totalSeconds = Math.floor(durationMs / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            if (minutes === 0) return `${seconds}秒`;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // ========== 核心修改：坐位体前屈毫米转厘米 ==========
        function getScoreDisplay(sportId, durationMs, legal) {
            // 跳绳类
            if (sportId === 'E-1-10' || sportId === 'E-1-4') {
                if (legal !== undefined && legal !== null) return `${legal}个`;
                return formatTimeFromMs(durationMs);
            }
            // 仰卧起坐、引体向上
            if (sportId === 'E-1-1' || sportId === 'E-1-2') {
                if (legal !== undefined && legal !== null) return `${legal}个`;
                return formatTimeFromMs(durationMs);
            }
            // 立定跳远
            if (sportId === 'E-1-3') {
                if (legal !== undefined && legal !== null) return `${legal}cm`;
                return '-';
            }
            // 坐位体前屈 - 毫米转厘米，保留一位小数
            if (sportId === 'E-1-5') {
                if (legal !== undefined && legal !== null) {
                    const cm = (legal / 10).toFixed(1);
                    return `${cm}cm`;
                }
                return '-';
            }
            // 实心球
            if (sportId === 'E-1-6') {
                if (legal !== undefined && legal !== null) return `${legal}cm`;
                return '-';
            }
            // 立定摸高
            if (sportId === 'E-1-7') {
                if (legal !== undefined && legal !== null) return `${legal}cm`;
                return '-';
            }
            // 跑步类
            if (sportId?.includes('E-2')) {
                return formatTimeFromMs(durationMs);
            }
            return durationMs ? (durationMs / 1000).toFixed(2) + '秒' : '-';
        }

        function getLegalDisplay(sportId, legal) {
            if (sportId === 'E-1-10' || sportId === 'E-1-4') return legal !== undefined ? legal : '-';
            if (sportId === 'E-1-1' || sportId === 'E-1-2') return legal !== undefined ? legal : '-';
            return '-';
        }

        // ========== 修改评级：坐位体前屈按厘米评级 ==========
        function getLevel(sportId, legal, durationMs) {
            // 跳绳类
            if (sportId === 'E-1-10' || sportId === 'E-1-4') {
                if (legal >= 180) return '优秀';
                if (legal >= 140) return '良好';
                if (legal >= 100) return '及格';
                return '不及格';
            }
            // 仰卧起坐、引体向上
            if (sportId === 'E-1-1' || sportId === 'E-1-2') {
                if (legal >= 50) return '优秀';
                if (legal >= 40) return '良好';
                if (legal >= 30) return '及格';
                return '不及格';
            }
            // 立定跳远
            if (sportId === 'E-1-3') {
                if (legal >= 250) return '优秀';
                if (legal >= 220) return '良好';
                if (legal >= 190) return '及格';
                return '不及格';
            }
            // 坐位体前屈 - 厘米评级
            if (sportId === 'E-1-5') {
                const cm = legal ? legal / 10 : 0;
                if (cm >= 16) return '优秀';
                if (cm >= 12) return '良好';
                if (cm >= 8) return '及格';
                return '不及格';
            }
            // 跑步类
            if (sportId?.includes('E-2')) {
                const seconds = durationMs / 1000;
                if (seconds <= 7.5) return '优秀';
                if (seconds <= 8.5) return '良好';
                if (seconds <= 10.0) return '及格';
                return '不及格';
            }
            return '未知';
        }

        function getBadgeClass(level) {
            if (level === '优秀') return 'badge-excellent';
            if (level === '良好') return 'badge-good';
            if (level === '及格') return 'badge-pass';
            return 'badge-fail';
        }

        // ========== 本地成绩存储 ==========
        async function syncScoresToLocal(scores) {
            if (!window.electronAPI || !window.electronAPI.scoreSaveMultiple) return;
            try {
                const newScores = [];
                for (const s of scores) {
                    const exists = await window.electronAPI.scoreExists(s.uid, new Date(s.completedTime).toISOString());
                    if (!exists) {
                        newScores.push({
                            uid: s.uid,
                            name: s.name || s.uid,
                            sportId: s.sportId,
                            sportName: SPORT_NAME_MAP[s.sportId] || s.sportId,
                            duration: s.duration || 0,
                            legal: s.legal || 0,
                            illegal: s.illegal || 0,
                            className: s.className || '',
                            scoreTime: new Date(s.completedTime).toISOString(),
                            source: s.isRealtime ? '实时' : '累计'
                        });
                    }
                }
                if (newScores.length > 0) {
                    await window.electronAPI.scoreSaveMultiple(newScores);
                    console.log(`已同步 ${newScores.length} 条新成绩到本地`);
                }
            } catch (e) {
                console.error('同步成绩到本地失败:', e);
            }
        }

        async function loadLocalScores(limit = 300) {
            if (!window.electronAPI || !window.electronAPI.scoreGetRecent) return [];
            try {
                const rows = await window.electronAPI.scoreGetRecent(limit);
                return rows.map(r => ({
                    uid: r.uid,
                    name: r.name || r.uid,
                    sportId: r.sport_id,
                    duration: r.duration,
                    legal: r.legal,
                    illegal: r.illegal,
                    className: r.class_name,
                    time: r.score_time ? new Date(r.score_time).toLocaleString() : '-',
                    completedTime: r.score_time ? new Date(r.score_time).getTime() : 0,
                    source: r.source,
                    isRealtime: r.source === '实时'
                }));
            } catch (e) {
                console.error('读取本地成绩失败:', e);
                return [];
            }
        }

        // WebSocket 变量
        let ws = null;
        let isConnected = false;
        let reconnectAttempts = 0;
        let maxReconnectAttempts = 5;

        // 数据存储
        let allScores = [];
        let realtimeScores = [];
        let currentPage = 1;
        let pageSize = 15;

        // DOM 元素
        const wsStatus = document.getElementById('wsStatus');
        const wsLog = document.getElementById('wsLog');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const clearLogBtn = document.getElementById('clearLogBtn');
        const clearDataBtn = document.getElementById('clearDataBtn');
        const searchUid = document.getElementById('searchUid');
        const searchName = document.getElementById('searchName');
        const searchSport = document.getElementById('searchSport');
        const searchBtn = document.getElementById('searchBtn');
        const scoreTableBody = document.getElementById('scoreTableBody');
        const resultCountSpan = document.getElementById('resultCount');
        const realtimeTableBody = document.getElementById('realtimeTableBody');
        const realtimeCountSpan = document.getElementById('realtimeCount');
        const totalCountSpan = document.getElementById('totalCount');
        const totalLegalSpan = document.getElementById('totalLegal');
        const avgScoreSpan = document.getElementById('avgScore');
        const bestScoreSpan = document.getElementById('bestScore');
        const studentCountSpan = document.getElementById('studentCount');
        const paginationDiv = document.getElementById('pagination');

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        function addLog(message, type = 'info') {
            const logDiv = document.createElement('div');
            logDiv.className = 'log-item';
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML = `[${time}] ${message}`;
            if (type === 'error') logDiv.style.color = '#ff6b6b';
            if (type === 'success') logDiv.style.color = '#00ff88';
            wsLog.appendChild(logDiv);
            logDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
            while (wsLog.children.length > 100) wsLog.removeChild(wsLog.firstChild);
        }

        function renderRealtimeTable() {
            if (!realtimeScores || realtimeScores.length === 0) {
                realtimeTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">暂无实时数据，等待WebSocket推送...</td></tr>';
                realtimeCountSpan.innerText = '0条';
                return;
            }
            
            realtimeCountSpan.innerText = realtimeScores.length + '条';
            let html = '';
            for (let item of realtimeScores.slice(0, 20)) {
                const sportName = getSportName(item.sportId);
                const scoreDisplay = getScoreDisplay(item.sportId, item.duration, item.legal);
                const level = getLevel(item.sportId, item.legal, item.duration);
                const badgeClass = getBadgeClass(level);
                
                html += `
                    <tr>
                        <td><span class="realtime-badge"></span>${item.time || '-'}</td>
                        <td>${escapeHtml(item.uid || '-')}</td>
                        <td>${escapeHtml(item.name || '-')}</td>
                        <td>${escapeHtml(sportName)}</td>
                        <td><strong>${scoreDisplay}</strong></td>
                        <td><span class="badge ${badgeClass}">${level}</span></td>
                    </tr>
                `;
            }
            realtimeTableBody.innerHTML = html;
        }

        function renderScoreTable() {
            if (!allScores || allScores.length === 0) {
                scoreTableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;">暂无数据，请点击查询</td></tr>';
                resultCountSpan.innerText = '0条';
                return;
            }
            
            const start = (currentPage - 1) * pageSize;
            const pageData = allScores.slice(start, start + pageSize);
            resultCountSpan.innerText = allScores.length + '条';
            
            let html = '';
            for (let item of pageData) {
                const sportName = getSportName(item.sportId);
                const scoreDisplay = getScoreDisplay(item.sportId, item.duration, item.legal);
                const legalDisplay = getLegalDisplay(item.sportId, item.legal);
                const level = getLevel(item.sportId, item.legal, item.duration);
                const badgeClass = getBadgeClass(level);
                
                html += `
                    <tr>
                        <td>${item.time || '-'}</td>
                        <td>${escapeHtml(item.uid || '-')}</td>
                        <td>${escapeHtml(item.name || '-')}</td>
                        <td>${escapeHtml(item.className || '-')}</td>
                        <td>${escapeHtml(sportName)}</td>
                        <td><strong>${scoreDisplay}</strong></td>
                        <td>${legalDisplay}</td>
                        <td>${item.illegal || 0}次</td>
                        <td><span class="badge ${badgeClass}">${level}</span></td>
                    </tr>
                `;
            }
            scoreTableBody.innerHTML = html;
            
            const totalPages = Math.ceil(allScores.length / pageSize);
            if (totalPages > 1) {
                let pageHtml = '';
                for (let i = 1; i <= totalPages; i++) {
                    pageHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
                paginationDiv.innerHTML = pageHtml;
            } else {
                paginationDiv.innerHTML = '';
            }
        }

        window.goToPage = function(page) {
            currentPage = page;
            renderScoreTable();
        };

        function updateStats() {
            totalCountSpan.innerText = allScores.length;
            let totalLegal = 0;
            let bestScore = null;
            let scoreSum = 0;
            let scoreCount = 0;
            const uids = new Set();
            
            for (let item of allScores) {
                uids.add(item.uid);
                if (item.sportId === 'E-1-10' || item.sportId === 'E-1-4') {
                    if (item.legal !== undefined && item.legal !== null) totalLegal += item.legal;
                }
                if (item.sportId === 'E-1-10' || item.sportId === 'E-1-4') {
                    if (item.legal !== undefined && item.legal !== null) {
                        scoreSum += item.legal;
                        scoreCount++;
                        if (bestScore === null || item.legal > bestScore) bestScore = item.legal;
                    }
                } else if (item.sportId?.includes('E-2')) {
                    if (item.duration) {
                        const seconds = item.duration / 1000;
                        scoreSum += seconds;
                        scoreCount++;
                        if (bestScore === null || seconds < bestScore) bestScore = seconds;
                    }
                } else if (item.legal !== undefined && item.legal !== null) {
                    scoreSum += item.legal;
                    scoreCount++;
                    if (bestScore === null || item.legal > bestScore) bestScore = item.legal;
                }
            }
            
            totalLegalSpan.innerText = totalLegal;
            studentCountSpan.innerText = uids.size;
            if (scoreCount > 0) {
                const avg = scoreSum / scoreCount;
                avgScoreSpan.innerText = avg.toFixed(1);
                bestScoreSpan.innerText = bestScore !== null ? bestScore : 0;
            } else {
                avgScoreSpan.innerText = '0';
                bestScoreSpan.innerText = '0';
            }
        }

        function processRealtimeData(data) {
            let parsed = typeof data === 'string' ? JSON.parse(data) : data;
            const taskType = parsed.task_info?.task_type;
            
            if (taskType === 'score') {
                const taskInfo = parsed.task_info || {};
                const sportInfo = parsed.sport_info || {};
                const scoreInfo = parsed.score_info || {};
                const sportId = sportInfo.sport_id;
                const completedTime = taskInfo.task_completed_time;
                const scoreList = scoreInfo.score_list || [];
                const playbackUrls = scoreInfo.publicPlayback || scoreInfo.playback || [];
                
                for (let score of scoreList) {
                    const uid = score.uid;
                    if (!uid || uid === '') continue;
                    
                    const scoreRecords = score.score_records || score.score_public_records || [];
                    const newScore = {
                        taskId: taskInfo.task_id,
                        sportId: sportId,
                        uid: uid,
                        name: score.name || '-',
                        duration: score.duration,
                        legal: score.legal,
                        illegal: score.illegal,
                        trainingMode: sportInfo.training_mode,
                        scoreRecords: scoreRecords,
                        playbackUrls: playbackUrls,
                        time: completedTime ? new Date(completedTime).toLocaleString() : new Date().toLocaleString(),
                        completedTime: completedTime || Date.now(),
                        isRealtime: true
                    };
                    
                    realtimeScores.unshift(newScore);
                    if (realtimeScores.length > 50) realtimeScores.pop();
                    
                    allScores.unshift(newScore);
                    if (allScores.length > 500) allScores.pop();
                    
                    addLog(`📥 实时成绩: ${getSportName(sportId)} - ${uid} - ${getScoreDisplay(sportId, score.duration, score.legal)}`, 'success');
                }
                
                // 保存实时成绩到本地（异步，不阻塞）
                syncScoresToLocal(scoreList.map(s => ({
                    uid: s.uid,
                    name: s.name || '-',
                    sportId: sportId,
                    duration: s.duration,
                    legal: s.legal,
                    illegal: s.illegal,
                    completedTime: completedTime || Date.now(),
                    isRealtime: true
                }))).catch(() => {});
                
                renderRealtimeTable();
                updateStats();
                currentPage = 1;
                renderScoreTable();
            }
        }

        function connectWebSocket() {
            if (ws && isConnected) {
                addLog('⚠️ 已经连接', 'info');
                return;
            }
            addLog('🔗 正在连接 WebSocket...', 'info');
            wsStatus.className = 'status-badge connecting';
            wsStatus.innerText = '⏳ 连接中...';
            try {
                ws = new WebSocket(WS_URL);
                ws.onopen = () => {
                    isConnected = true;
                    reconnectAttempts = 0;
                    wsStatus.className = 'status-badge connected';
                    wsStatus.innerText = '✅ 已连接';
                    addLog('✅ WebSocket 连接成功！等待接收实时数据...', 'success');
                };
                ws.onmessage = (e) => processRealtimeData(e.data);
                ws.onerror = () => {
                    wsStatus.className = 'status-badge disconnected';
                    wsStatus.innerText = '❌ 错误';
                    addLog('❌ 连接错误', 'error');
                };
                ws.onclose = () => {
                    isConnected = false;
                    wsStatus.className = 'status-badge disconnected';
                    wsStatus.innerText = '❌ 断开';
                    addLog('🔌 连接已关闭', 'info');
                    if (reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts++;
                        addLog(`🔄 ${reconnectAttempts}/${maxReconnectAttempts}秒后重连...`, 'info');
                        setTimeout(connectWebSocket, 3000);
                    }
                };
            } catch(e) {
                addLog(`❌ 失败: ${e.message}`, 'error');
            }
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
                isConnected = false;
                addLog('🔌 已手动断开', 'info');
            }
        }

        function clearLog() {
            wsLog.innerHTML = '<div class="log-item">📡 日志已清空</div>';
        }

        function clearAllData() {
            if (confirm('确定清空所有成绩数据吗？（包括本地缓存）')) {
                allScores = [];
                realtimeScores = [];
                currentPage = 1;
                updateStats();
                renderScoreTable();
                renderRealtimeTable();
                addLog('🗑️ 已清空所有数据', 'info');
                // 同步清空本地 SQLite
                if (window.electronAPI && window.electronAPI.scoreClear) {
                    window.electronAPI.scoreClear().catch(e => console.error('清空本地成绩失败:', e));
                }
            }
        }

        function parseScoreResponse(data, targetUid) {
            const taskInfoScoreList = data.data?.taskInfoScoreList || data.taskInfoScoreList || [];
            const scores = [];
            for (let task of taskInfoScoreList) {
                const taskInfo = task.task_info || {};
                const sportInfo = task.sport_info || {};
                const scoreInfo = task.score_info || {};
                const taskId = taskInfo.task_id;
                const sportId = sportInfo.sport_id;
                const completedTime = taskInfo.task_completed_time;
                const scoreList = scoreInfo.score_list || [];
                const playbackUrls = scoreInfo.publicPlayback || scoreInfo.playback || [];
                
                for (let score of scoreList) {
                    if (targetUid && score.uid !== targetUid) continue;
                    
                    const scoreRecords = score.score_records || score.score_public_records || [];
                    scores.push({
                        taskId: taskId,
                        sportId: sportId,
                        uid: score.uid,
                        name: score.name || '-',
                        duration: score.duration,
                        legal: score.legal,
                        illegal: score.illegal,
                        trainingMode: sportInfo.training_mode,
                        scoreRecords: scoreRecords,
                        playbackUrls: playbackUrls,
                        time: completedTime ? new Date(completedTime).toLocaleString() : '-',
                        completedTime: completedTime || 0,
                        isRealtime: false
                    });
                }
            }
            return scores;
        }

        async function queryByUid(uid, sportId) {
            try {
                // 指定了具体项目，直接查询
                if (sportId && sportId !== '') {
                    const body = { uid: uid, offset: 1, pageSize: 100, order: "date", sportId: sportId };
                    const response = await fetch(QUERY_BY_UID_API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const result = await response.json();
                    if (result.code === 0) {
                        return parseScoreResponse(result, uid);
                    }
                    return [];
                }
                
                // 全部项目：顺序逐个查询（避免并发导致连接被限）
                const allSportIds = Object.keys(SPORT_NAME_MAP);
                const allScores = [];
                for (const sid of allSportIds) {
                    try {
                        const body = { uid: uid, offset: 1, pageSize: 100, order: "date", sportId: sid };
                        const response = await fetch(QUERY_BY_UID_API, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });
                        const result = await response.json();
                        if (result.code === 0) {
                            const scores = parseScoreResponse(result, uid);
                            allScores.push(...scores);
                        }
                    } catch (err) {
                        console.error('[score] 查询项目失败:', sid, err.message);
                    }
                }
                // 按完成时间倒序排序
                allScores.sort((a, b) => (b.completedTime || 0) - (a.completedTime || 0));
                return allScores;
            } catch (err) {
                console.error('查询失败:', err);
                return [];
            }
        }

        // 从本地数据库补充班级信息
        async function enrichStudentInfo(scores) {
            if (!window.electronAPI || !window.electronAPI.dbGetAll) return scores;
            try {
                const students = await window.electronAPI.dbGetAll();
                const studentMap = new Map();
                for (const s of students) studentMap.set(s.uid, s);
                for (const score of scores) {
                    const stu = studentMap.get(score.uid);
                    if (stu) {
                        if (stu.name) score.name = stu.name;
                        score.className = stu.className || '-';
                    }
                }
            } catch (e) { console.error('获取学生信息失败:', e); }
            return scores;
        }

        // 从本地 SQLite 按姓名查找 uid 列表
        async function findUidsByName(nameKeyword) {
            const uids = [];
            try {
                if (window.electronAPI && window.electronAPI.dbGetAll) {
                    const students = await window.electronAPI.dbGetAll();
                    const kw = nameKeyword.toLowerCase();
                    for (const s of students) {
                        if ((s.name && s.name.toLowerCase().includes(kw)) ||
                            (s.uid && s.uid.toLowerCase().includes(kw))) {
                            uids.push(s.uid);
                        }
                    }
                }
            } catch (e) { console.error('本地学生查询失败:', e); }
            return uids;
        }

        async function performQuery() {
            scoreTableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;"><div class="loading">⏳ 正在查询...</div></td></tr>';
            const uid = searchUid.value.trim();
            const name = searchName.value.trim().toLowerCase();
            const sportId = searchSport.value;
            
            let scores = [];
            
            if (uid) {
                // 按 UID 查询
                scores = await queryByUid(uid, sportId);
            } else if (name) {
                // 只输入姓名：从本地 SQLite 模糊匹配 uid，再批量查询成绩
                const matchedUids = await findUidsByName(name);
                if (matchedUids.length === 0) {
                    scoreTableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;"><div class="empty-state">📭 本地未找到匹配的学生，请先在「学生管理」页面导入学生</div></td></tr>';
                    allScores = [];
                    currentPage = 1;
                    updateStats();
                    renderScoreTable();
                    return;
                }
                for (const matchedUid of matchedUids.slice(0, 20)) {
                    const uidScores = await queryByUid(matchedUid, sportId);
                    scores.push(...uidScores);
                }
            } else {
                // 无输入时：加载本地最近20条成绩
                scoreTableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;"><div class="loading">⏳ 正在加载本地记录...</div></td></tr>';
                const localScores = await loadLocalScores(20);
                await enrichStudentInfo(localScores);
                allScores = localScores;
                currentPage = 1;
                updateStats();
                renderScoreTable();
                if (allScores.length === 0) {
                    scoreTableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;"><div class="empty-state">📭 暂无本地缓存数据，请输入学号/UID查询</div></td></tr>';
                }
                return;
            }
            
            // 前端按姓名二次过滤（支持重名时进一步筛选）
            if (name) {
                scores = scores.filter(s => (s.name || '').toLowerCase().includes(name) || (s.uid || '').toLowerCase().includes(name));
            }
            
            // 补充班级信息
            await enrichStudentInfo(scores);
            
            scores.sort((a, b) => (b.completedTime || 0) - (a.completedTime || 0));
            allScores = scores;
            currentPage = 1;
            updateStats();
            renderScoreTable();
            
            // 保存查询结果到本地（异步，不阻塞）
            syncScoresToLocal(allScores).catch(() => {});
        }

        // 事件绑定
        connectBtn.addEventListener('click', connectWebSocket);
        disconnectBtn.addEventListener('click', disconnectWebSocket);
        clearLogBtn.addEventListener('click', clearLog);
        clearDataBtn.addEventListener('click', clearAllData);
        searchBtn.addEventListener('click', performQuery);
        searchUid.addEventListener('keypress', (e) => { if (e.key === 'Enter') performQuery(); });
        searchName.addEventListener('keypress', (e) => { if (e.key === 'Enter') performQuery(); });
        searchSport.addEventListener('change', performQuery);
        
        window.addEventListener('load', async () => {
            // 先加载本地最近20条成绩，立即渲染不阻塞
            const localScores = await loadLocalScores(20);
            await enrichStudentInfo(localScores);
            if (localScores.length > 0) {
                allScores = localScores;
                updateStats();
                renderScoreTable();
                addLog(`📦 已加载 ${localScores.length} 条本地历史成绩`, 'info');
            } else {
                scoreTableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;"><div class="empty-state">📭 暂无本地缓存数据，请输入学号/UID查询</div></td></tr>';
            }
            // WebSocket 连接
            setTimeout(connectWebSocket, 1000);
            renderRealtimeTable();
        });
        window.addEventListener('beforeunload', () => { if (ws) ws.close(); });
    </script>
